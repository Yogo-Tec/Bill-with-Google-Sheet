<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Shop</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="#"
        >
            🛍️ My Shop
        </a>


        <button
            class="btn btn-warning"
            onclick="openCart()"
        >

            🛒 Cart

            <span id="cartCount">
                0
            </span>

        </button>

    </div>

</nav>



<!-- =========================================
     MAIN
========================================= -->

<main class="container py-4">


    <div class="text-center mb-4">

        <h1>
            Our Products
        </h1>

        <p class="text-muted">
            Choose your products and add them to cart.
        </p>

    </div>


    <!-- Loading -->

    <div
        id="loading"
        class="text-center py-5"
    >

        <div
            class="spinner-border text-primary"
        ></div>

        <p class="mt-3">
            Loading products...
        </p>

    </div>


    <!-- Error -->

    <div
        id="error"
        class="alert alert-danger d-none"
    >
    </div>


    <!-- Products -->

    <div
        id="productList"
        class="row g-4"
    ></div>


</main>



<!-- =========================================
     CART MODAL
========================================= -->

<div
    class="modal fade"
    id="cartModal"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    🛒 Your Cart
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">

                <div id="cartItems">
                </div>


                <hr>


                <div class="text-end">

                    <strong>
                        Subtotal:
                    </strong>

                    ₹<span id="cartTotal">
                        0
                    </span>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Continue Shopping
                </button>


                <button
                    class="btn btn-success"
                    onclick="checkout()"
                >
                    Checkout
                </button>

            </div>

        </div>

    </div>

</div>



<!-- =========================================
     CHECKOUT MODAL
========================================= -->

<div
    class="modal fade"
    id="checkoutModal"
    tabindex="-1"
>

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    📦 Checkout
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">


                <div class="mb-3">

                    <label class="form-label">
                        Your Name
                    </label>

                    <input
                        id="customerName"
                        type="text"
                        class="form-control"
                        placeholder="Rahul"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Mobile Number
                    </label>

                    <input
                        id="customerMobile"
                        type="tel"
                        class="form-control"
                        placeholder="9876543210"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Delivery Address
                    </label>

                    <textarea
                        id="customerAddress"
                        class="form-control"
                        rows="4"
                        placeholder="123, Main Road&#10;Sivakasi&#10;Tamil Nadu - 626123"
                    ></textarea>

                </div>


                <div class="alert alert-info">

                    <strong>
                        Delivery:
                    </strong>

                    ₹50

                    <br>

                    <strong>
                        Payment:
                    </strong>

                    Manual Payment

                </div>


            </div>


            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>


                <button
                    id="placeOrderButton"
                    class="btn btn-success"
                    onclick="placeOrder()"
                >

                    📤 Send Order to WhatsApp

                </button>

            </div>

        </div>

    </div>

</div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script
    src="script.js"
></script>


</body>

</html>
